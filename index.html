<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="YricOTF 的 GitHub Pages 项目导航">
<title>YricOTF · 项目站点</title>
<style>
  :root{color-scheme:dark;--bg:#10151c;--panel:#171f29;--line:#303c4a;--text:#f4f6fa;--muted:#afbac8;--accent:#ffb76c;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}
  a{color:inherit;text-decoration:none}
  button,input{font:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  .wrap{width:min(1120px,calc(100% - 48px));margin-inline:auto}
  .top{border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;min-height:70px;gap:16px}
  .brand{display:flex;align-items:center;gap:10px;font:700 1rem var(--mono)}
  .brand img{width:34px;height:34px;border-radius:50%;background:var(--panel)}
  .profile,.repo{color:var(--muted);font-size:.875rem}
  a:hover{color:var(--accent)}
  .hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:stretch;margin:48px 0 52px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--panel)}
  .intro{padding:clamp(28px,5vw,62px)}
  .kicker{font:600 .875rem var(--mono);color:var(--accent);margin:0 0 18px}
  h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.12;letter-spacing:-.055em;margin:0}
  .intro>p:last-child{color:var(--muted);margin:18px 0 0}
  .address{display:grid;place-items:center;min-height:135px;padding:20px;background-color:#232f3d;background-image:radial-gradient(#526173 1px,transparent 1px);background-size:18px 18px}
  .address span{font:600 clamp(.9rem,2vw,1.22rem) var(--mono);background:#10151c;color:var(--accent);border:1px solid #526173;border-radius:12px;padding:12px 16px}
  .section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:14px}
  h2{font-size:1.7rem;line-height:1.25;margin:0}
  .tools{display:flex;align-items:center;gap:8px}
  input,button{min-height:42px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:8px 12px;font-size:.875rem}
  input{width:min(240px,46vw)}
  input::placeholder{color:var(--muted)}
  button{cursor:pointer;white-space:nowrap}
  button:hover:enabled{border-color:var(--accent);color:var(--accent)}
  button:disabled{cursor:wait;color:var(--muted)}
  .status{font-size:.875rem;color:var(--muted);margin:0 0 16px;min-height:1.6em}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .card{display:flex;flex-direction:column;min-width:0;min-height:190px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:15px}
  .card:hover{border-color:#687789}
  h3{font:650 1.06rem/1.45 var(--mono);margin:0;overflow-wrap:anywhere}
  .description{color:var(--muted);margin:9px 0 17px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
  .site{color:var(--accent);font-weight:650;font-size:.875rem}
  .site:hover,.repo:hover{text-decoration:underline;text-underline-offset:4px}
  footer{margin-top:48px;padding:22px 0;border-top:1px solid var(--line);font-size:.875rem;color:var(--muted)}
  @media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:570px){.wrap{width:calc(100% - 32px)}.hero{grid-template-columns:1fr;margin:26px 0 34px}.section-head{align-items:stretch;flex-direction:column;gap:14px}.tools input{flex:1;width:0}.grid{grid-template-columns:1fr}.card{min-height:150px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="https://github.com/YricOTF">
      <img src="https://avatars.githubusercontent.com/u/117163589?v=4&amp;s=68" width="34" height="34" alt="">
      YricOTF
    </a>
    <a class="profile" href="https://github.com/YricOTF?tab=repositories">GitHub 仓库</a>
  </div>
</header>
<main class="wrap">
  <section class="hero" aria-labelledby="title">
    <div class="intro">
      <p class="kicker">GitHub Pages</p>
      <h1 id="title">项目站点</h1>
      <p>在这里打开我发布的项目网页。</p>
    </div>
    <div class="address"><span>yricotf.github.io</span></div>
  </section>
  <section aria-labelledby="directory">
    <div class="section-head">
      <h2 id="directory">站点目录</h2>
      <div class="tools">
        <input id="search" type="search" placeholder="搜索项目" aria-label="搜索项目">
        <button id="refresh" type="button">刷新目录</button>
      </div>
    </div>
    <p id="status" class="status" role="status"></p>
    <div id="projects" class="grid"></div>
    <noscript><p>请启用 JavaScript 查看目录，或前往 <a href="https://github.com/YricOTF?tab=repositories">GitHub 仓库列表</a>。</p></noscript>
  </section>
</main>
<footer><div class="wrap">© YricOTF</div></footer>
<script id="initial-sites" type="application/json">[{"description": null, "language": "JavaScript", "name": "pelican-velo"}, {"description": "rls game", "language": "JavaScript", "name": "SteelFrontline"}, {"description": null, "language": "JavaScript", "name": "wdfz"}, {"description": "yric's h5 set", "language": "HTML", "name": "libraryWorld"}, {"description": "果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！果子潮了！…", "language": "HTML", "name": "gzcl"}, {"description": "a game", "language": "HTML", "name": "PONG84_Classic"}]</script>
<script type="module">
  const owner = 'YricOTF'
  const host = owner.toLowerCase() + '.github.io'
  const cacheKey = 'yricotf-pages-v1'
  const search = document.querySelector('#search')
  const refresh = document.querySelector('#refresh')
  const status = document.querySelector('#status')
  const projects = document.querySelector('#projects')
  let repositories = JSON.parse(document.querySelector('#initial-sites').textContent)
  let hasCachedDirectory = false
  let syncMessage = '正在检测 GitHub Pages…'

  function link(label, href, className) {
    const anchor = document.createElement('a')
    anchor.textContent = label
    anchor.href = href
    anchor.className = className
    return anchor
  }

  function createCard(repository) {
    const name = encodeURIComponent(repository.name)
    const card = document.createElement('article')
    card.className = 'card'
    const title = document.createElement('h3')
    title.textContent = repository.name
    const description = document.createElement('p')
    description.className = 'description'
    description.textContent = repository.description || repository.language || ''
    description.hidden = !description.textContent
    const actions = document.createElement('div')
    actions.className = 'actions'
    const site = link('打开站点', `https://${host}/${name}/`, 'site')
    site.setAttribute('aria-label', `打开站点 ${repository.name}`)
    const source = link('查看仓库', `https://github.com/${owner}/${name}`, 'repo')
    source.setAttribute('aria-label', `查看仓库 ${repository.name}`)
    actions.append(site, source)
    card.append(title, description, actions)
    return card
  }

  function render() {
    const query = search.value.trim().toLowerCase()
    const matches = repositories.filter(({name, description}) =>
      name.toLowerCase().includes(query) || (description || '').toLowerCase().includes(query)
    )
    projects.replaceChildren(...matches.map(createCard))
    const count = query ? `匹配 ${matches.length} / ${repositories.length} 个站点` : `${repositories.length} 个站点`
    status.textContent = [repositories.length || !syncMessage ? count : '', syncMessage].filter(Boolean).join(' · ')
  }

  async function discover() {
    const signal = AbortSignal.timeout(15000)
    const result = []
    for (let page = 1; ; page++) {
      const url = `https://api.github.com/users/${owner}/repos?type=owner&sort=pushed&per_page=100&page=${page}`
      const response = await fetch(url, {signal, cache: 'no-cache'})
      if (!response.ok) {
        const limited = response.status === 429 || response.headers.get('x-ratelimit-remaining') === '0'
        throw new Error(limited ? 'GitHub API 请求次数已达上限' : 'GitHub 目录暂时无法访问')
      }
      const batch = await response.json()
      for (const {name, description, language, has_pages} of batch) {
        if (has_pages && name.toLowerCase() !== host) result.push({name, description, language})
      }
      if (batch.length < 100) break
    }
    return result
  }

  async function sync() {
    refresh.disabled = true
    syncMessage = '正在检测 GitHub Pages…'
    render()
    try {
      repositories = await discover()
      hasCachedDirectory = true
      syncMessage = repositories.length ? '已同步 GitHub' : '还没有发现启用 GitHub Pages 的项目仓库'
      try { localStorage.setItem(cacheKey, JSON.stringify(repositories)) } catch {}
    } catch (error) {
      const reason = error.message.startsWith('GitHub') ? error.message : '暂时无法同步 GitHub'
      syncMessage = `${reason}，显示${hasCachedDirectory ? '上次获取的' : '内置'}目录`
    } finally {
      refresh.disabled = false
      render()
    }
  }

  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey))
    if (Array.isArray(cached)) {
      repositories = cached
      hasCachedDirectory = true
    }
  } catch {}
  search.addEventListener('input', render)
  refresh.addEventListener('click', sync)
  sync()
</script>
</body>
</html>
